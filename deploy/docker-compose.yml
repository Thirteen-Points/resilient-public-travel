services:
  resilient-route-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        APP_BUILD_SHA: ${APP_BUILD_SHA:-unknown}
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=${DEBUG:-false}
      - OFFLINE_MODE=${OFFLINE_MODE:-true}
      - AI_ENABLED=${AI_ENABLED:-${LLM_ENABLED:-false}}
      - AI_DISABLE_EXTERNAL=${AI_DISABLE_EXTERNAL:-false}
      - AI_BUDGET_CNY=${AI_BUDGET_CNY:-50}
      - AI_MAX_OUTPUT_TOKENS=${AI_MAX_OUTPUT_TOKENS:-2048}
      - AI_CACHE_TTL_S=${AI_CACHE_TTL_S:-900}
      - AI_UNKNOWN_REQUEST_RESERVE_CNY=${AI_UNKNOWN_REQUEST_RESERVE_CNY:-1}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-flash}
      - DEEPSEEK_INPUT_COST_PER_MILLION=${DEEPSEEK_INPUT_COST_PER_MILLION:-2}
      - DEEPSEEK_CACHE_HIT_COST_PER_MILLION=${DEEPSEEK_CACHE_HIT_COST_PER_MILLION:-0.04}
      - DEEPSEEK_OUTPUT_COST_PER_MILLION=${DEEPSEEK_OUTPUT_COST_PER_MILLION:-8}
      - QWEN_API_KEY=${QWEN_API_KEY:-}
      - QWEN_BASE_URL=${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - QWEN_MODEL=${QWEN_MODEL:-qwen-turbo}
      - GLM_API_KEY=${GLM_API_KEY:-}
      - GLM_BASE_URL=${GLM_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      - GLM_MODEL=${GLM_MODEL:-glm-4-flash}
      - REVIEW_API_TOKEN=${REVIEW_API_TOKEN:-}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH:-}
      - ADMIN_ENCRYPTION_KEY=${ADMIN_ENCRYPTION_KEY:-}
      - ADMIN_COOKIE_SECURE=${ADMIN_COOKIE_SECURE:-true}
      - DEPLOY_ENV=docker
      - APP_BUILD_SHA=${APP_BUILD_SHA:-unknown}
    volumes:
      - ../data:/app/data:ro
      - ../contracts:/app/contracts:ro
      # Both events.sqlite3 and admin.sqlite3 live in this parent directory.
      - app_data:/app/backend/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

volumes:
  app_data:
