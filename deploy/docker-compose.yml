version: "3.9"

services:
  resilient-route-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=${DEBUG:-false}
      - OFFLINE_MODE=${OFFLINE_MODE:-true}
      - LLM_ENABLED=${LLM_ENABLED:-false}
      - DEPLOY_ENV=docker
      - DEPLOY_VERSION=${DEPLOY_VERSION:-1.0.0}
    volumes:
      - ../data:/app/data:ro
      - ../contracts:/app/contracts:ro
      - cache_data:/app/backend/app/data/cache
      - snapshot_data:/app/backend/app/data/snapshots
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

volumes:
  cache_data:
  snapshot_data:
