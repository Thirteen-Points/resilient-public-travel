services:
  - type: web
    name: resilient-public-travel-api
    runtime: python
    branch: main
    plan: starter
    region: singapore
    numInstances: 1
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health/deep
    disk:
      name: resilient-public-travel-data
      mountPath: /opt/render/project/src/backend/app/data
      sizeGB: 1
    envVars:
      - key: OFFLINE_MODE
        value: "false"
      - key: BUS_NETWORK_ENABLED
        value: "true"
      - key: AI_ENABLED
        value: "true"
      - key: AI_DISABLE_EXTERNAL
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        value: https://resilient-public-travel.pages.dev
      - key: REVIEW_API_TOKEN
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: ADMIN_ENCRYPTION_KEY
        sync: false
