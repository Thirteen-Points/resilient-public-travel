services:
  - type: web
    name: resilient-public-travel-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r backend/requirements.txt && python scripts/preflight.py
    startCommand: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: OFFLINE_MODE
        value: "true"
      - key: AI_ENABLED
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        value: https://resilient-public-travel.pages.dev
      - key: REVIEW_API_TOKEN
        sync: false
