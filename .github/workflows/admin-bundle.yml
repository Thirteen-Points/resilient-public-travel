name: Administrator bundle
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build:admin
        working-directory: frontend
      - run: git diff --exit-code -- backend/app/admin_static
      - run: test -z "$(git ls-files --others --exclude-standard backend/app/admin_static)"
