name: Render API health ping

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check configured Render API health endpoint
        env:
          RENDER_API_URL: ${{ vars.RENDER_API_URL }}
        run: |
          if [ -z "$RENDER_API_URL" ]; then
            echo "Set the repository variable RENDER_API_URL to the Render service origin."
            exit 1
          fi
          curl --fail --show-error --silent --max-time 20 "${RENDER_API_URL%/}/api/health"
